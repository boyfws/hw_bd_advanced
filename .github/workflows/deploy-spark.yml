name: deploy spark on yarn

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-14
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REMOTE_DIR: hw4-runs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Проверить синтаксис
        run: bash -n hw_4/deploy.sh

      - name: Настроить SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/hw4_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hw4_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/hw4_key" >/dev/null
          cat > "$HOME/.ssh/config" <<'SSH'
          Host hw4-edge
            HostName 171.22.72.225
            User team
            IdentityFile ~/.ssh/hw4_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 30
            ServerAliveCountMax 3
          SSH
          chmod 600 "$HOME/.ssh/config"

      - name: Передать файлы на edge
        run: |
          tar -czf hw4-upload.tgz hw_4/deploy.sh hw_3/transactions.csv
          ssh hw4-edge "mkdir -p '$REMOTE_DIR'"
          scp hw4-upload.tgz "hw4-edge:$REMOTE_DIR/upload.tgz"

      - name: Выполнить задание и проверить Hive
        run: |
          ssh hw4-edge "cd '$REMOTE_DIR' && tar -xzf upload.tgz && bash hw_4/deploy.sh"

      - name: Получить отчёты, в том числе при ошибке
        if: always()
        run: |
          mkdir -p hw4-results
          if test -f "$HOME/.ssh/config"; then
            scp -r "hw4-edge:$REMOTE_DIR/hw_4/results/." hw4-results/ || true
          fi

      - name: Сохранить доказательства выполнения
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw4-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw4-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Удалить ключ с runner
        if: always()
        run: rm -f "$HOME/.ssh/hw4_key"
