
name: Check PostgreSQL Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-14
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"

      - name: Inspect PostgreSQL host
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            team@171.22.72.225 'bash -se' <<'EDGE'
          set -euo pipefail

          ssh -i "$HOME/.ssh/team_internal" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            team@team-14-00 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "=== Host ==="
          hostname
          whoami

          echo "=== Operating system ==="
          cat /etc/os-release

          echo "=== CPU architecture ==="
          uname -m

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h /

          echo "=== PostgreSQL ==="
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            echo "psql not found"
          fi

          if command -v pg_config >/dev/null 2>&1; then
            pg_config --version
          else
            echo "pg_config not found"
          fi

          echo "=== PostgreSQL packages ==="
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query -W 'postgresql*' 2>/dev/null || true
          elif command -v rpm >/dev/null 2>&1; then
            rpm -qa | grep -i postgresql || true
          fi

          echo "=== Ports 5432 and 9083 ==="
          ss -ltn | grep -E ':(5432|9083)[[:space:]]' || echo "No listeners on these ports"

          echo "=== Package manager ==="
          command -v apt-get || command -v dnf || command -v yum || true

          echo "=== Sudo ==="
          if sudo -n true 2>/dev/null; then
            echo "Passwordless sudo available"
          else
            echo "Passwordless sudo unavailable"
          fi

          echo "PostgreSQL host inspection completed"
          REMOTE
          EDGE
