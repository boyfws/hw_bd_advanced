
name: Repair Hive Metastore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-14
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"

      - name: Repair and restart Metastore
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            team@171.22.72.225 \
            'ssh -i ~/.ssh/team_internal -o BatchMode=yes team@team-14-00 bash -se' <<'REMOTE'
          set -euo pipefail

          test "$(hostname -s)" = "team-14-00"
          test "$(whoami)" = "team"

          HIVE_HOME="$HOME/apache-hive-4.1.0-bin"
          HADOOP_HOME="$HOME/hadoop-3.5.0"
          CONFIG="$HIVE_HOME/conf/hive-site.xml"
          BACKUP="$HOME/hw3-metastore-config.backup.xml"
          LOG="$HOME/hw3-metastore-restart.log"

          export HIVE_HOME HADOOP_HOME
          export PATH="$HIVE_HOME/bin:$HADOOP_HOME/bin:$PATH"
          export HADOOP_CLIENT_OPTS="-Xmx768m"

          echo "1. Проверяем службы Hadoop"
          jps | grep -E '[[:space:]]DataNode$'
          jps | grep -E '[[:space:]]NodeManager$'

          echo "2. Проверяем конфигурацию"
          test -s "$CONFIG"
          test -x "$HIVE_HOME/bin/hive"

          echo "3. Создаём резервную копию"
          cp -p "$CONFIG" "$BACKUP"
          chmod 600 "$BACKUP"

          echo "4. Ограничиваем пул подключений"
          python3 - "$CONFIG" <<'PY'
          import os
          import sys
          import tempfile
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()

          key = "datanucleus.connectionPool.maxPoolSize"
          found = False

          for prop in root.findall("property"):
              if prop.findtext("name") == key:
                  value = prop.find("value")
                  if value is None:
                      value = ET.SubElement(prop, "value")
                  value.text = "5"
                  found = True

          if not found:
              prop = ET.SubElement(root, "property")
              ET.SubElement(prop, "name").text = key
              ET.SubElement(prop, "value").text = "5"

          fd, temporary = tempfile.mkstemp(
              prefix=".hive-site-", dir=os.path.dirname(path)
          )
          try:
              with os.fdopen(fd, "wb") as output:
                  tree.write(output, encoding="utf-8",
                             xml_declaration=True)
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)

          print("Размер пула установлен: 5")
          PY

          echo "5. Определяем процесс Metastore"
          mapfile -t PIDS < <(
            jps -lv | awk '/-Dproc_metastore([[:space:]]|$)/ {print $1}'
          )

          if [[ "${#PIDS[@]}" -ne 1 ]]; then
              echo "Ошибка: найдено Metastore-процессов: ${#PIDS[@]}"
              exit 1
          fi

          PID="${PIDS[0]}"

          if ! tr '\0' ' ' < "/proc/$PID/cmdline" |
               grep -q -- '-Dproc_metastore'; then
              echo "Ошибка: процесс не подтверждён"
              exit 1
          fi

          if ! ss -ltnp | grep ':9083 ' | grep -q "pid=$PID,"; then
              echo "Ошибка: процесс не подтверждён на порту 9083"
              exit 1
          fi

          echo "6. Останавливаем только Metastore PID=$PID"
          kill -TERM "$PID"

          STOPPED=0
          for i in $(seq 1 30); do
              if ! kill -0 "$PID" 2>/dev/null; then
                  STOPPED=1
                  break
              fi
              sleep 2
          done

          if [[ "$STOPPED" -ne 1 ]]; then
              echo "Metastore не остановился; другие службы не трогаем"
              exit 1
          fi

          echo "7. Запускаем Metastore с новой конфигурацией"
          nohup "$HIVE_HOME/bin/hive" --service metastore \
            > "$LOG" 2>&1 < /dev/null &

          READY=0
          for i in $(seq 1 60); do
              if ss -ltn | grep -Eq ':9083[[:space:]]'; then
                  READY=1
                  break
              fi
              sleep 2
          done

          if [[ "$READY" -ne 1 ]]; then
              echo "Новый Metastore не запустился"
              echo "Восстанавливаем предыдущую конфигурацию"
              cp -p "$BACKUP" "$CONFIG"
              echo "Пробуем вернуть прежнюю службу"
              nohup "$HIVE_HOME/bin/hive" --service metastore \
                >> "$LOG" 2>&1 < /dev/null &
              exit 1
          fi

          echo "8. Проверяем подключения PostgreSQL"
          sudo -n -u postgres psql -X -Atqc \
            "SELECT usename, state, count(*)
             FROM pg_stat_activity
             WHERE usename = 'hive'
             GROUP BY usename, state;"

          echo "9. Проверяем Hadoop после запуска"
          jps | grep -E '[[:space:]]DataNode$'
          jps | grep -E '[[:space:]]NodeManager$'

          echo "Metastore открыл порт 9083 после перезапуска"
          REMOTE
