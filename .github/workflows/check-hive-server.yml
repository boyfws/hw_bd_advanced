name: Check Hive Server

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -e

          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"

      - name: Check server
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            team@171.22.72.225 \
            'bash -s' <<'EOF'
          set -e

          echo "=== Server ==="
          hostname

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h /home/team

          echo "=== Java ==="
          java -version

          echo "=== Hadoop ==="
          /home/team/hadoop-3.5.0/bin/hadoop version | head -n 3

          echo "=== PostgreSQL client ==="
          if command -v psql >/dev/null 2>&1; then
              psql --version
          else
              echo "PostgreSQL client not found"
          fi

          echo "=== PostgreSQL server ==="
          if command -v pg_config >/dev/null 2>&1; then
              pg_config --version
          else
              echo "PostgreSQL development tools not found"
          fi

          echo "=== Listening ports ==="
          for port in 5432 9083 10000; do
              echo "Port $port:"
              ss -ltn "( sport = :$port )"
          done

          echo "=== Existing Hive processes ==="
          ps -eo pid,comm,args | grep -E '[H]iveServer2|[H]iveMetaStore' || true

          echo "=== Sudo access ==="
          if sudo -n true 2>/dev/null; then
              echo "Passwordless sudo available"
          else
              echo "Passwordless sudo unavailable"
          fi
          EOF

      - name: Check other nodes
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            team@171.22.72.225 \
            'bash -s' <<'EOF'
          set -e

          for node in team-14-nn team-14-00 team-14-01; do

              echo "================================"
              echo "Checking node: $node"
              echo "================================"

              ssh -i "$HOME/.ssh/team_internal" \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=accept-new \
                  -o ConnectTimeout=10 \
                  "team@$node" '
                      echo "=== Hostname ==="
                      hostname

                      echo "=== Memory ==="
                      free -h

                      echo "=== Disk ==="
                      df -h /home/team

                      echo "=== Java ==="
                      java -version 2>&1 | head -n 1

                      echo "=== Listening ports ==="
                      ss -ltn

                      echo "=== PostgreSQL client ==="
                      if command -v psql >/dev/null 2>&1; then
                          psql --version
                      else
                          echo "PostgreSQL client not found"
                      fi

                      echo "=== PostgreSQL server packages ==="
                      dpkg-query -W postgresql postgresql-common 2>/dev/null || true

                      echo "=== PostgreSQL processes ==="
                      ps -eo pid,comm,args | grep "[p]ostgres" || true

                      echo "=== Sudo access ==="
                      if sudo -n true 2>/dev/null; then
                          echo "Passwordless sudo available"
                      else
                          echo "Passwordless sudo unavailable"
                      fi
                  '
          done
          EOF
