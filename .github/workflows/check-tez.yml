name: Check Tez

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Validate script
        run: bash -n hw_3/check_tez.sh

      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"

      - name: Copy script to edge
        run: |
          scp -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            hw_3/check_tez.sh \
            team@171.22.72.225:/home/team/check_tez.sh

      - name: Check Tez on all nodes
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== EDGE ==="
          bash /home/team/check_tez.sh

          for node in team-14-00 team-14-01 team-14-nn; do
            echo "=== $node ==="
            ssh -i "$HOME/.ssh/team_internal" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "team@$node" \
              'bash -s' < /home/team/check_tez.sh

          done
          REMOTE
