
name: Check Hive Archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-14
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"

      - name: Inspect archives and disk
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            team@171.22.72.225 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd "$HOME/hw3-downloads"

          echo "=== Free disk space ==="
          df -h "$HOME"

          echo "=== Hive archive: first entries ==="
          tar -tzf apache-hive-4.1.0-bin.tar.gz | head -n 8 || true

          echo "=== Tez archive: first entries ==="
          tar -tzf apache-tez-0.10.5-bin.tar.gz | head -n 12 || true

          echo "=== Existing installation directories ==="
          for dir in \
            "$HOME/apache-hive-4.1.0-bin" \
            "$HOME/apache-tez-0.10.5-bin"; do
            if [ -e "$dir" ]; then
              echo "EXISTS: $dir"
            else
              echo "FREE: $dir"
            fi
          done

          echo "Archive inspection completed"
          REMOTE
