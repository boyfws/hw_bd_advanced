
name: Check HiveServer2 Log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"




      - name: Diagnose Hive INSERT
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "=== QUERY ERRORS ==="
          grep -Ein -C 6 \
            '5c94e86e|Caused by:|Exception|FAILED|ERROR|Tez|YarnException' \
            /tmp/team/hive.log | tail -n 130 || true

          echo "=== TEZ CONFIGURATION ==="
          test -f /home/team/apache-tez-0.10.5-bin/conf/tez-site.xml
          grep -E 'tez.lib.uris|tez.use.cluster.hadoop-libs' \
            /home/team/apache-tez-0.10.5-bin/conf/tez-site.xml || true

          echo "=== YARN APPLICATIONS ==="
          /home/team/hadoop-3.5.0/bin/yarn application -list \
            -appStates ALL | tail -n 20
          REMOTE
      

