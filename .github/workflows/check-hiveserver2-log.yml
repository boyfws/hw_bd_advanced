
name: Check HiveServer2 Log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"


      - name: Read Metastore errors
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 \
            'ssh -i ~/.ssh/team_internal -o BatchMode=yes team@team-14-00 bash -se' <<'REMOTE'
          set -euo pipefail

          echo "=== METASTORE ERRORS ==="
          grep -Ein -C 3 \
            'get_current_notificationEventId|exception|caused by|failed|error|connection|too many' \
            /home/team/hw3-metastore-restart.log |
            tail -n 100 || true

          echo "=== DATABASE CONNECTIONS ==="
          sudo -n -u postgres psql -Atqc \
            "SELECT usename, state, count(*)
             FROM pg_stat_activity
             WHERE usename = 'hive'
             GROUP BY usename, state;"

          echo "=== METASTORE PROCESS ==="
          jps -l | grep RunJar || true
          REMOTE
      
