
name: Check HiveServer2 Log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"






      
      - name: Check HiveServer2 health
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 'bash -se' <<'REMOTE'
          set -euo pipefail

          export HADOOP_HOME=/home/team/hadoop-3.5.0
          export HIVE_HOME=/home/team/apache-hive-4.1.0-bin
          export HADOOP_CONF_DIR="$HADOOP_HOME/etc/hadoop"
          export PATH="$HADOOP_HOME/bin:$HIVE_HOME/bin:$PATH"

          echo "PORT 10000"
          ss -ltnp | grep ':10000' || true

          echo "JAVA PROCESSES"
          jps -lv | grep -Ei 'HiveServer2|RunJar|service.server' || true

          echo "PROCESS LIST"
          ps -eo pid,ppid,args |
            grep -Ei '[h]iveserver2|[H]iveServer2' |
            head -n 15 || true

          echo "BEELINE TEST"
          timeout 60 "$HIVE_HOME/bin/beeline" \
            -u 'jdbc:hive2://127.0.0.1:10000/default' \
            -e 'SHOW DATABASES;'
          REMOTE

