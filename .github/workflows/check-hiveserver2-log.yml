
name: Check HiveServer2 Log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/private_key" "$HOME/.ssh/known_hosts"






      
     
      - name: Diagnose HiveServer2 startup
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "=== PROCESS ==="
          ps -p 336554 -o pid,etime,%cpu,%mem,stat,args \
            | cut -c 1-200 || true

          echo "=== PORT ==="
          ss -ltnp | grep ':10000' || true

          echo "=== SERVER LOG ==="
          tail -n 100 /tmp/team/hive.log \
            | grep -Ei -C 3 \
              'ERROR|Exception|Caused by|Tez|failed|retry|session' \
            | tail -n 75 || true

          echo "=== STARTUP LOG ==="
          tail -n 60 /home/team/hw3-hiveserver2.log
          REMOTE

