
name: Diagnose PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/private_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/private_key"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose PostgreSQL connections
        run: |
          ssh -i "$HOME/.ssh/private_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            team@171.22.72.225 \
            'ssh -i ~/.ssh/team_internal \
            -o BatchMode=yes \
            team@team-14-00 \
            "sudo -n -u postgres psql -X -v ON_ERROR_STOP=1"' <<'SQL'
          SELECT current_setting('max_connections')
            AS max_connections;

          SELECT current_setting('superuser_reserved_connections')
            AS superuser_reserved_connections;

          SELECT count(*) AS active_connections
          FROM pg_stat_activity;

          SELECT
              usename,
              application_name,
              state,
              count(*) AS connections
          FROM pg_stat_activity
          GROUP BY usename, application_name, state
          ORDER BY connections DESC;

          SELECT
              datname,
              count(*) AS connections
          FROM pg_stat_activity
          WHERE datname IS NOT NULL
          GROUP BY datname
          ORDER BY connections DESC;
          SQL
