x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped

services:
  edge:
    <<: *node
    hostname: team-14-en
    ports:
      - "127.0.0.1:2201:22"
    volumes:
      - ./keys/gateway/id_ed25519.pub:/run/keys/authorized_key.pub:ro
      - ./keys/cluster/id_ed25519:/run/keys/cluster_key:ro
      - edge_data:/data
    networks:
      cluster:
        ipv4_address: 10.14.0.10
        aliases:
          - team-14-en

  namenode:
    <<: *node
    hostname: team-14-nn
    volumes:
      - ./keys/cluster/id_ed25519.pub:/run/keys/authorized_key.pub:ro
      - namenode_data:/data
    networks:
      cluster:
        ipv4_address: 10.14.0.11
        aliases:
          - team-14-nn

  datanode0:
    <<: *node
    hostname: team-14-00
    volumes:
      - ./keys/cluster/id_ed25519.pub:/run/keys/authorized_key.pub:ro
      - datanode0_data:/data
    networks:
      cluster:
        ipv4_address: 10.14.0.12
        aliases:
          - team-14-00

  datanode1:
    <<: *node
    hostname: team-14-01
    volumes:
      - ./keys/cluster/id_ed25519.pub:/run/keys/authorized_key.pub:ro
      - datanode1_data:/data
    networks:
      cluster:
        ipv4_address: 10.14.0.13
        aliases:
          - team-14-01

networks:
  cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 10.14.0.0/24

volumes:
  edge_data:
  namenode_data:
  datanode0_data:
  datanode1_data: